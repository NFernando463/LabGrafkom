<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panggung Freddy, Chica &amp; Bonnie - Grafika 3D</title>
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #08060c; }
        canvas { display: block; width: 100%; height: 100%; cursor: grab; }
        canvas:active { cursor: grabbing; }
        #scene-ui {
            position: fixed;
            bottom: 22px;
            left: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #f5e9ef;
            font: 600 13px/1.4 "Segoe UI", sans-serif;
            letter-spacing: 0.04em;
            text-shadow: 0 2px 12px #000;
            pointer-events: none;
        }
        #scene-status {
            padding: 9px 13px;
            border: 1px solid #c87b9b80;
            border-radius: 999px;
            background: #170d1dcc;
            backdrop-filter: blur(8px);
        }
        #replay {
            padding: 9px 14px;
            border: 1px solid #efb3ca99;
            border-radius: 999px;
            color: #fff4f8;
            background: #4e1f3bcc;
            font: inherit;
            cursor: pointer;
            pointer-events: auto;
        }
        #replay:hover { background: #713250; }
        #vignette {
            position: fixed; inset: 0; pointer-events: none;
            background: radial-gradient(ellipse at 50% 45%, transparent 45%, #000000c8 100%);
        }
        #scare-flash {
            position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: 0;
            background: radial-gradient(ellipse at 50% 45%, #fff 0%, #ffb8b8 24%, #a90018 100%);
        }
        canvas#mycanvas { filter: saturate(0.9) contrast(1.06); }
        #noise { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.09; mix-blend-mode: screen; image-rendering: pixelated; }
        #scanlines { position: fixed; inset: 0; pointer-events: none; opacity: 0.35;
            background: repeating-linear-gradient(0deg, #0000 0, #0000 2px, #00000055 3px, #0000 4px); }
        #cam-ui { position: fixed; top: 22px; left: 26px; color: #e9e4ee; pointer-events: none;
            font: 700 22px/1.2 "Courier New", monospace; letter-spacing: 0.06em; text-shadow: 0 0 8px #000; }
        #cam-ui small { display: block; font-size: 13px; opacity: 0.75; letter-spacing: 0.12em; }
        #rec { position: fixed; top: 26px; right: 28px; color: #f04050; font: 700 18px "Courier New", monospace;
            letter-spacing: 0.1em; pointer-events: none; text-shadow: 0 0 8px #000; animation: blink 1.1s steps(2) infinite; }
        @keyframes blink { 50% { opacity: 0.15; } }
        #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 3px; background: #ffffff14; pointer-events: none; }
        #bar-fill { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #c87b9b, #f0b36a); }
        #hint {
            position: fixed; right: 20px; bottom: 14px; color: #f5e9ef99; pointer-events: none;
            font: 500 11px/1.4 "Segoe UI", sans-serif; letter-spacing: 0.04em; text-shadow: 0 1px 6px #000;
        }
        body.jumpscare-active #scene-ui,
        body.jumpscare-active #hint,
        body.jumpscare-active #bar,
        body.jumpscare-active #cam-ui,
        body.jumpscare-active #rec,
        body.jumpscare-active #scanlines { opacity: 0; }
        @media (max-width: 600px) {
            #scene-ui { bottom: 14px; left: 12px; font-size: 11px; }
            #cam-ui { font-size: 16px; top: 14px; left: 14px; }
        }
    </style>
</head>
<body>
    <canvas id="mycanvas" aria-label="Panggung pertunjukan 3D"></canvas>
    <canvas id="noise"></canvas>
    <div id="scanlines"></div>
    <div id="vignette"></div>
    <div id="cam-ui">Show Stage<small>CAM 1A</small></div>
    <div id="rec">● REC</div>
    <div id="scare-flash"></div>
    <div id="bar"><i id="bar-fill"></i></div>
    <div id="hint">Seret: putar kamera · Scroll: zoom · Klik ganda: reset</div>
    <div id="scene-ui">
        <span id="scene-status" aria-live="polite">Freddy, Chica &amp; Bonnie membuka pertunjukan bersama</span>
        <button id="replay" type="button">Ulangi animasi</button>
    </div>
    <!-- supaya halaman model Freddy/Chica/Bonnie tidak ikut menjalankan mode "?part=" sendiri saat dipakai di panggung -->
    <script>window.FREDDY_FULL = window.CHICA_FULL = window.BONNIE_FULL = true;</script>
    <script type="module" src="./main.js"></script>
</body>
</html>
